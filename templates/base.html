<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackName</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">TrackName</a>
        <div class="nav-links">
            <a href="/" class="{% if request.path == '/' or request.path == '/search' %}active{% endif %}">Buscar</a>
            <a href="/lyrics" class="{% if request.path.startswith('/lyrics') %}active{% endif %}">Por letra</a>
            <a href="/history" class="{% if request.path == '/history' %}active{% endif %}">Historial</a>
            <a href="/favorites" class="{% if request.path == '/favorites' %}active{% endif %}">Favoritos</a>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        Powered by Genius API
    </footer>
</body>
</html>
